name: TypeScript validation

on:
  push:
    branches:
      - action-ledger-development
  pull_request:
    branches:
      - action-ledger-development

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies from the committed lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - name: Type-check application
        run: pnpm exec tsc --noEmit --pretty false
      - name: Install Chromium for isolated browser fixtures
        run: pnpm exec puppeteer browsers install chrome
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - name: Run DOM discovery browser fixtures
        run: pnpm run test:dom-discovery
